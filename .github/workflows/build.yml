name: Build APK

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          set -x
          ls -la /root/.local/share/godot/export_templates/ || true
          TPL=$(find / -name android_debug.apk -not -path "/proc/*" 2>/dev/null | head -1)
          echo "template: $TPL"
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable ~/.config/godot build
          cp -r "$(dirname "$TPL")"/. ~/.local/share/godot/export_templates/4.3.stable/
          test -f ~/.local/share/godot/export_templates/4.3.stable/android_debug.apk || { echo "TEMPLATE NOT FOUND"; exit 1; }
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          JAVA_DIR=$(dirname $(dirname $(readlink -f $(which javac))))
          SDK_DIR=${ANDROID_HOME:-/usr/lib/android-sdk}
          SDKM=$(which sdkmanager || find $SDK_DIR /usr -name sdkmanager -type f 2>/dev/null | head -1)
          yes | "$SDKM" --sdk_root="$SDK_DIR" "build-tools;34.0.0" || true
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$SDK_DIR" "$JAVA_DIR" > ~/.config/godot/editor_settings-4.tres

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          godot --headless --import || true
          godot --headless --export-debug "Android" build/avanza.apk

      - uses: actions/upload-artifact@v4
        with:
          name: avanza-apk
          path: build/avanza.apk
